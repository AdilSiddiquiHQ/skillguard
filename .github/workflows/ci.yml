name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Run the test suite
        run: node --test

      - name: Scan a clean skill (expected to pass)
        run: node bin/skillsleuth.js examples/conventional-commit --fail-on high

      - name: Scan the malicious fixture (expected to fail)
        run: |
          set +e
          node bin/skillsleuth.js examples/cleanup-trap --fail-on high > /dev/null 2>&1
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "::error::expected SkillSleuth to fail on the malicious fixture (got exit $status)"
            exit 1
          fi
          echo "SkillSleuth correctly flagged the malicious fixture."

      - name: Adversarial evasion suite (expected to fail)
        run: |
          set +e
          node bin/skillsleuth.js examples/evasion --fail-on high --json > /tmp/evasion.json 2>/dev/null
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "::error::evasion fixtures must fail the gate (got exit $status)"
            exit 1
          fi
          node -e "
            const r = require('/tmp/evasion.json');
            const ids = r.skills.flatMap(s => s.findings.map(f => f.ruleId));
            const evasions = r.skills.flatMap(s => s.evasions);
            const need = ['SG-EVA-001', 'SG-EVA-003', 'SG-EXEC-001', 'SG-INJ-001'];
            for (const id of need) if (!ids.includes(id)) { console.error('missing ' + id); process.exit(1); }
            for (const e of ['base64', 'zero-width']) if (!evasions.includes(e)) { console.error('missing evasion ' + e); process.exit(1); }
            console.log('evasion detection verified');
          "

      - name: Baseline round-trip
        run: |
          node bin/skillsleuth.js examples/cleanup-trap --write-baseline /tmp/base.json --force > /dev/null
          node bin/skillsleuth.js examples/cleanup-trap --baseline /tmp/base.json --quiet
          node bin/skillsleuth.js examples/cleanup-trap --baseline /tmp/base.json --json \
            | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{const r=JSON.parse(d);if(r.summary.findings!==0){console.error('baseline did not clear findings');process.exit(1)}})"

      - name: Sign and verify an attestation
        run: |
          node bin/skillsleuth.js keygen --out /tmp/sgkeys > /dev/null
          node bin/skillsleuth.js sign examples/conventional-commit --key /tmp/sgkeys/skillsleuth.key --out /tmp/att.json > /dev/null
          node bin/skillsleuth.js verify /tmp/att.json --key /tmp/sgkeys/skillsleuth.pub

      - name: Verify SARIF, badge, HTML and SBOM outputs
        run: |
          node bin/skillsleuth.js examples/conventional-commit --fail-on none \
            --sarif /tmp/skillsleuth.sarif --badge /tmp/skillsleuth-badge.svg \
            --html /tmp/skillsleuth.html --sbom /tmp/skillsleuth.sbom.json --json > /dev/null
          node -e "
            const fs = require('fs');
            const sarif = JSON.parse(fs.readFileSync('/tmp/skillsleuth.sarif', 'utf8'));
            if (sarif.version !== '2.1.0') { console.error('bad SARIF'); process.exit(1); }
            const bom = JSON.parse(fs.readFileSync('/tmp/skillsleuth.sbom.json', 'utf8'));
            if (bom.bomFormat !== 'CycloneDX' || bom.specVersion !== '1.6') { console.error('bad SBOM'); process.exit(1); }
            console.log('SARIF and CycloneDX outputs validated');
          "
          test -s /tmp/skillsleuth-badge.svg
          test -s /tmp/skillsleuth.html

  security:
    name: Self-scan (SARIF)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run SkillSleuth across the repository
        run: node bin/skillsleuth.js . --fail-on none --sarif skillsleuth.sarif

      - name: Upload SARIF to GitHub code scanning
        # `security-events: write` is not granted to pull requests from forks.
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: skillsleuth.sarif
          category: skillsleuth
