    <rect width="125" height="20" fill="url(#s)"/>
  </g>
  <g fill="#fff" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="110" text-rendering="geometricPrecision">
    <text x="360" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="620">skillguard</text>
    <text x="360" y="140" transform="scale(.1)" textLength="620">skillguard</text>
    <text x="985" y="150" fill="#010101" fill-opacity=".3" transform="scale(.1)" textLength="430">passing</text>
    <text x="985" y="140" transform="scale(.1)" textLength="430">passing</text>
  </g>
  <!-- skillguard 0.2.0 -->
