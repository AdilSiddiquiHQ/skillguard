# Example: scan every pull request and upload findings to GitHub code scanning.
# Copy this file to .github/workflows/skillsleuth.yml in your repository.

name: SkillSleuth

on:
  pull_request:
    paths:
      - "**/SKILL.md"
      - "**/*.skill.md"
      - ".claude/skills/**"
      - ".github/workflows/skillsleuth.yml"
  push:
    branches: [main]

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Option A: use the published composite action
      - uses: AdilSiddiquiHQ/skillsleuth@main
        with:
          path: .
          fail-on: high
          sarif-file: skillsleuth.sarif

      # Option B: run it directly without any action
      # - run: npx github:AdilSiddiquiHQ/skillsleuth . --fail-on high --sarif skillsleuth.sarif

      - name: Upload SARIF to GitHub code scanning
        # Skip on fork PRs, where `security-events: write` is not granted.
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: skillsleuth.sarif
          category: skillsleuth
